<script>
  const cells = Array.from(document.querySelectorAll('.cell'));
  function stopAll(){
    cells.forEach(c=>{ const a=c.querySelector('audio'); a.pause(); a.currentTime=0; c.classList.remove('active'); });
  }
  cells.forEach(cell=>{
    const audio = cell.querySelector('audio');
    audio.addEventListener('ended', ()=>cell.classList.remove('active'));
    cell.addEventListener('click', ()=>{
      if (cell.classList.contains('active')){ audio.pause(); audio.currentTime=0; cell.classList.remove('active'); return; }
      stopAll();
      cell.classList.add('active');
      audio.currentTime = 0;
      audio.play();
    });
  });
</script>
