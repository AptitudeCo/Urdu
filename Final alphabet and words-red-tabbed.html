<title>Urdu Alphabet — Red Letters (Tabbed)</title>
<style>
  /* === Tab bar (pure CSS, no JavaScript) === */
  .tab-input {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    border: 0;
  }
  .tab-bar {
    display: flex;
    border-bottom: 2px solid #D4C9B8;
    margin: 0;
    padding: 16px 16px 0;
    background: #FAF7F2;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab {
    padding: 10px 24px;
    cursor: pointer;
    border: 1px solid #D4C9B8;
    border-bottom: none;
    border-radius: 8px 8px 0 0;
    background: #E8DFCC;
    font-size: 14px;
    color: #666;
    margin-right: -1px;
    margin-bottom: -1px;
    position: relative;
    user-select: none;
    font-family: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  .tab:hover { background: #F2EAD8; color: #1A1A1A; }
  #tab-naskh:checked    ~ .tab-bar label[for="tab-naskh"],
  #tab-nastaliq:checked ~ .tab-bar label[for="tab-nastaliq"],
  #tab-alphabet:checked ~ .tab-bar label[for="tab-alphabet"],
  #tab-alphabet-naskh:checked ~ .tab-bar label[for="tab-alphabet-naskh"] {
    background: #FAF7F2;
    font-weight: 600;
    z-index: 1;
  }
  #tab-naskh:checked    ~ .tab-bar label[for="tab-naskh"]    { color: #1E40AF; }
  #tab-nastaliq:checked ~ .tab-bar label[for="tab-nastaliq"] { color: #8B4513; }
  #tab-alphabet:checked ~ .tab-bar label[for="tab-alphabet"] { color: #047857; }
  #tab-alphabet-naskh:checked ~ .tab-bar label[for="tab-alphabet-naskh"] { color: #6B21A8; }

  /* === Show/hide iframes === */
  .frame { display: none; width: 100%; height: calc(100vh - 60px); border: 0; background: #FAF7F2; }
  #tab-naskh:checked    ~ .frame-naskh    { display: block; }
  #tab-nastaliq:checked ~ .frame-nastaliq { display: block; }
  #tab-alphabet:checked ~ .frame-alphabet { display: block; }
  #tab-alphabet-naskh:checked ~ .frame-alphabet-naskh { display: block; }
</style>
</head>
<body style="margin: 0; padding: 0; background: #FAF7F2;">

<!-- Tab radio inputs (hidden, drive the pure-CSS tab switch) -->
<input type="radio" name="urdu-view" id="tab-naskh"    class="tab-input" checked>
<input type="radio" name="urdu-view" id="tab-nastaliq" class="tab-input">
<input type="radio" name="urdu-view" id="tab-alphabet" class="tab-input">
<input type="radio" name="urdu-view" id="tab-alphabet-naskh" class="tab-input">
